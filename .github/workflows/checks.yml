# Every claim the pages make, run in public on every push.
# L1: cargo test on the SAME crates the browser runs (plus the wasm build,
#     so a lesson that stops compiling for the browser fails loudly).
# L2: the independent Python implementations of the flagship claims.
name: checks
on: [push, pull_request]
jobs:
  claims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: physics-lab
      # garust is a sibling path dependency, exactly as documented for
      # students in the README.
      - uses: actions/checkout@v4
        with:
          repository: westerngazoo/garust
          path: garust
      - name: L2 — independent Python checks
        working-directory: physics-lab/checks
        run: python3 run.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: L1 — the crates the pages run
        working-directory: physics-lab
        run: cargo test --workspace
      - name: L1b — the browser build still compiles
        working-directory: physics-lab
        run: cargo build --workspace --target wasm32-unknown-unknown --release
