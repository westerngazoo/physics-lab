# physics-lab lesson crates — Rust on garust, compiled to wasm32 for the
# browser and tested natively. cargo test here runs the same code the
# pages run; that identity is the whole point (RFC-001 §4.0).
[workspace]
resolver = "2"
members = ["lessons-common", "lessons/two-mirrors/crate", "lessons/three-mechanics/crate", "lessons/wave-equation/crate", "lessons/projectile/crate"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
